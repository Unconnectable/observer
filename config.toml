# 1. 挂载配置
[probes]
# 内核函数名 (tcp_sendmsg or  tcp_sendmsg_locked)
#sudo grep tcp_recv /proc/kallsyms    
target_func = "tcp_sendmsg"
#recv_func = "sock_recvmsg:"

recv_func = "tcp_recvmsg"   # 原本填的是 sock_recvmsg: 那是通用 socket 入口, 会把本机 AF_UNIX 当网络流量(实测占四成)

#recv_func = "tcp_recvmsg_locked"

accept_func = "inet_csk_accept"
retransmit_func = "tcp_retransmit_skb"

# IPv4 和 IPv6 的 UDP 是两个不同的内核函数, 必须各挂一组, 只挂 v4 会静默漏掉 IPv6
connect_func = "tcp_connect"
state_func = "tcp_set_state"
reset_func = "tcp_send_active_reset"
backpressure_func = "sk_stream_wait_memory"
udp_send_func = "udp_sendmsg"
udp_recv_func = "udp_recvmsg"
udp6_send_func = "udpv6_sendmsg"
udp6_recv_func = "udpv6_recvmsg"
# 2. 目标发现配置
[discovery]
# 自动发现目标进程名。如果想进入全量模式，请留空 "" 或填入不存在的名字。
# auto_detect_name = "websocket"
auto_detect_name = ""
# 也可以直接指定 PID，如果指定了 PID，则忽略上面的自动发现
# force_pid = 12345

# 3. 严格的过滤规则
[filters]
# 白名单】只显示名字中包含以下关键词的进程流量。如果为空，则允许所有。 ["tokio", "websocket"]
include_names = []

# 【黑名单】绝对不显示名字中包含以下关键词的进程流量。
# 比如排除掉 IDE 的干扰：["node", "ssh", "bash"]
# exclude_names = []
exclude_names = ["node", "init", "Relay", "GnsPortTracker", "kworker"]
# exclude_names = ["node", "ssh", "bash"]
# 4. 性能调优
[settings]
# PerfBuffer 缓冲区大小 (2的幂)
perf_pages = 64

# 5. 单个 traffic.log 的上限(MB), 写满就切 traffic.2.log / traffic.3.log ...
# 填 0 或整行删掉 = 不限. 全局模式实测每分钟约 8.5 MB, 挂机一晚是十几 GB
max_log_mb = 64

# 6. 界面模式: "tui" = 实时界面(顶部速率 + 按 PID 明细表 + 最近事件, 按 q 退出)
# 或者 "text" 
# ui_mode = "text"

ui_mode = "tui"
